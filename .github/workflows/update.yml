name: Auto Update K-apt Data

on:
  schedule:
    # 매일 오전 9시, 오후 6시에 자동 갱신 (한국시간)
    - cron: '0 0,9 * * *'
  workflow_dispatch: # 언제든 수동으로 즉시 갱신 가능

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: |
          pip install -r requirements.txt

      - name: K-apt 데이터 수집 및 index.html 생성
        run: |
          python update_kapt.py

      - name: 변경사항 깃허브에 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html seen_bids.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update K-apt data [skip ci]" && git push)
